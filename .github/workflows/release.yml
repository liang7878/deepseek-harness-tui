# Build every native runtime closure on its target runner, validate one immutable
# six-tarball set, then publish platform packages before the meta package.
name: Release npm TUI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after packing and validation. Leave false for a credential-free dry run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-tui-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  platform:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-latest
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            manylinux: quay.io/pypa/manylinux_2_28_aarch64
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            manylinux: quay.io/pypa/manylinux_2_28_x86_64
          - platform: win32
            arch: x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Rebuild Linux node-pty against manylinux 2.28
        if: matrix.platform == 'linux'
        shell: bash
        env:
          MANYLINUX_IMAGE: ${{ matrix.manylinux }}
        run: |
          set -euo pipefail
          native_root="$PWD/.artifacts/npm-tui-native-build"
          rm -rf "$native_root"
          pnpm --filter dsh-tui-npm-runtime deploy \
            --legacy \
            --prod \
            --config.node-linker=hoisted \
            --config.auto-install-peers=false \
            --config.link-workspace-packages=true \
            --config.confirmModulesPurge=false \
            "$native_root"
          npm rebuild node-pty --build-from-source --prefix "$native_root"
          addon_dir="$(realpath "$native_root/node_modules/node-pty")"
          addon="$addon_dir/build/Release/pty.node"
          test -f "$addon_dir/build/Makefile" || {
            echo "::error::node-pty install did not generate $addon_dir/build/Makefile"
            exit 1
          }
          node_root="$(dirname "$(dirname "$(realpath "$(command -v node)")")")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/node-gyp:$HOME/.cache/node-gyp:ro" \
            -v "$HOME/setup-pnpm:$HOME/setup-pnpm:ro" \
            -v "$node_root:$node_root:ro" \
            -w "$addon_dir" \
            "$MANYLINUX_IMAGE" \
            bash -euxo pipefail -c \
              'rm -rf build/Release && make -C build -j2 BUILDTYPE=Release'
          test -f "$addon" || { echo "::error::$addon missing after manylinux rebuild"; exit 1; }
          compiled_addon="$PWD/.artifacts/npm-tui-native-addon/pty.node"
          mkdir -p "$(dirname "$compiled_addon")"
          cp "$addon" "$compiled_addon"
          pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          workspace_addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)/build/Release"
          mkdir -p "$workspace_addon_dir"
          cp "$compiled_addon" "$workspace_addon_dir/pty.node"

      - name: Build platform tarball
        run: >-
          npm run pack:tui --
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --platform-only

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tui-${{ matrix.platform }}-${{ matrix.arch }}
          path: .artifacts/npm-tui/*.tgz
          if-no-files-found: error
          retention-days: 7

  meta:
    name: meta package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build meta tarball
        run: npm run pack:tui -- --meta-only

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tui-meta
          path: .artifacts/npm-tui/*.tgz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate packed release
    needs: [platform, meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-tui-*
          path: .artifacts/npm-tui
          merge-multiple: true

      - name: Reject version mismatches and registry collisions
        run: >-
          npm run publish:tui --
          --from .artifacts/npm-tui
          --check-only

      - name: Verify installed Linux package through a PTY
        run: npm run verify:packed

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tui-release
          path: .artifacts/npm-tui/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish platform packages, then meta
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install release script dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: npm-tui-release
          path: .artifacts/npm-tui

      - name: Configure npm token fallback
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Publish with provenance
        run: >-
          npm run publish:tui --
          --from .artifacts/npm-tui
