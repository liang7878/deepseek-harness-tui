# The interactive terminal application over dsh-base. It mounts no HTTP or
# browser layer. The TUI drives the same in-process Agent and Session services.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-startup
      name: 'deepseek-harness-tui/startup'

    - id: tui-runtime
      name: 'deepseek-harness-tui'
      inject: [tuiStartup, settings]
      config:
        resume: !!js ctx.tuiStartup.resume
        cwd: !!js ctx.tuiStartup.cwd
        model: !!js ctx.tuiStartup.model
        theme: !!js ctx.tuiStartup.theme
        inline: !!js ctx.tuiStartup.inline
        color: !!js ctx.tuiStartup.color
        unicode: !!js ctx.tuiStartup.unicode
